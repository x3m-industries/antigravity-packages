name: Build and Publish Packages

on:
  schedule:
    - cron: '30 2 * * *' # Nightly at 02:30 UTC (04:30 CEST)
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all packages'
        required: false
        type: boolean
        default: false
      force_ide:
        description: 'Force rebuild Antigravity IDE only'
        required: false
        type: boolean
        default: false
      force_hub:
        description: 'Force rebuild Antigravity Hub only'
        required: false
        type: boolean
        default: false
      pkg_revision:
        description: 'Packaging release revision suffix (e.g. 1). Applies to the forced app(s), or both when none is forced.'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with deploy-pages.yml: releases and Pages deployments are serialized so a
# landing-page push can never deploy stale repository metadata over a fresh release.
concurrency:
  group: "packages-and-pages"
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.2'

jobs:
  check:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      ide_needs_build: ${{ steps.check.outputs.ide_needs_build }}
      hub_needs_build: ${{ steps.check.outputs.hub_needs_build }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
      ide_version: ${{ steps.check.outputs.ide_version }}
      ide_url_x64: ${{ steps.check.outputs.ide_url_x64 }}
      ide_url_arm64: ${{ steps.check.outputs.ide_url_arm64 }}
      hub_version: ${{ steps.check.outputs.hub_version }}
      hub_url_x64: ${{ steps.check.outputs.hub_url_x64 }}
      hub_url_arm64: ${{ steps.check.outputs.hub_url_arm64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          FORCE_IDE: ${{ inputs.force_ide }}
          FORCE_HUB: ${{ inputs.force_hub }}
          PKG_REVISION: ${{ inputs.pkg_revision }}
        run: |
          python3 scripts/check_upstream.py

  build:
    name: Build Packages & Repositories
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev apt-utils zstd

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set. Refusing to build unsigned packages."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          rm -rf ~/.rpmmacros
          {
            echo "%_openpgp_sign_id E83A23BC57FE6953E4B5F4657A48CA4D7E7B6601"
            echo "%_gpg_name E83A23BC57FE6953E4B5F4657A48CA4D7E7B6601"
            echo "%_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback"
          } > ~/.rpmmacros

      # Reuse prebuilt packages if only one of the apps changed.
      # No "|| true": a failed download must fail the job, otherwise those packages
      # would silently vanish from the repositories (they only reference the new release).
      - name: Reuse prebuilt Antigravity Hub packages
        if: needs.check.outputs.hub_needs_build != 'true' && needs.check.outputs.prev_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist/packages
          echo "Reusing prebuilt Hub packages from ${{ needs.check.outputs.prev_tag }}..."
          gh release download "${{ needs.check.outputs.prev_tag }}" \
            --pattern "antigravity-${{ needs.check.outputs.hub_version }}*" \
            --pattern "antigravity_${{ needs.check.outputs.hub_version }}*" \
            --dir ./dist/packages

      - name: Reuse prebuilt Antigravity IDE packages
        if: needs.check.outputs.ide_needs_build != 'true' && needs.check.outputs.prev_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist/packages
          echo "Reusing prebuilt IDE packages from ${{ needs.check.outputs.prev_tag }}..."
          gh release download "${{ needs.check.outputs.prev_tag }}" \
            --pattern "antigravity-ide-${{ needs.check.outputs.ide_version }}*" \
            --pattern "antigravity-ide_${{ needs.check.outputs.ide_version }}*" \
            --dir ./dist/packages

      # Build Antigravity IDE only if needed
      - name: Build Antigravity IDE (x86_64)
        if: needs.check.outputs.ide_needs_build == 'true'
        run: |
          python3 scripts/build_packages.py \
            --package antigravity-ide \
            --version-full "${{ needs.check.outputs.ide_version }}" \
            --url "${{ needs.check.outputs.ide_url_x64 }}" \
            --arch x86_64 \
            --output-dir ./dist/packages

      - name: Build Antigravity IDE (aarch64 / arm64)
        if: needs.check.outputs.ide_needs_build == 'true'
        run: |
          python3 scripts/build_packages.py \
            --package antigravity-ide \
            --version-full "${{ needs.check.outputs.ide_version }}" \
            --url "${{ needs.check.outputs.ide_url_arm64 }}" \
            --arch aarch64 \
            --output-dir ./dist/packages

      # Build Antigravity Hub only if needed
      - name: Build Antigravity Hub (x86_64)
        if: needs.check.outputs.hub_needs_build == 'true'
        run: |
          python3 scripts/build_packages.py \
            --package antigravity \
            --version-full "${{ needs.check.outputs.hub_version }}" \
            --url "${{ needs.check.outputs.hub_url_x64 }}" \
            --arch x86_64 \
            --output-dir ./dist/packages

      - name: Build Antigravity Hub (aarch64 / arm64)
        if: needs.check.outputs.hub_needs_build == 'true'
        run: |
          python3 scripts/build_packages.py \
            --package antigravity \
            --version-full "${{ needs.check.outputs.hub_version }}" \
            --url "${{ needs.check.outputs.hub_url_arm64 }}" \
            --arch aarch64 \
            --output-dir ./dist/packages

      - name: Flatten packages directory
        run: |
          find ./dist/packages -mindepth 2 -type f -exec mv -t ./dist/packages {} +
          find ./dist/packages -mindepth 1 -type d -delete
          ls -la ./dist/packages

      - name: Verify complete package set
        run: |
          ./scripts/verify_packages.sh ./dist/packages

      - name: Sign RPM packages with GPG
        run: |
          for f in ./dist/packages/*.rpm; do
            if ! rpm -qpi "$f" | grep -q "Signature.*(none)"; then
              echo "$f is already signed."
              continue
            fi
            echo "Signing $f..."
            rpmsign --addsign "$f"
            if rpm -qpi "$f" | grep -q "Signature.*(none)"; then
              echo "::error::$f was not signed!"
              exit 1
            fi
          done

      - name: Verify RPM signatures against the published public key
        run: |
          # Catches a signing secret that does not match RPM-GPG-KEY-antigravity (users would get gpgcheck failures)
          # A private rpm database avoids depending on the runner's system rpmdb (root-owned).
          RPMDB="$(mktemp -d)"
          rpm --dbpath "$RPMDB" --import RPM-GPG-KEY-antigravity
          rpm --dbpath "$RPMDB" -qa 'gpg-pubkey*'
          rpm --dbpath "$RPMDB" -Kv ./dist/packages/*.rpm
          rpm --dbpath "$RPMDB" -K ./dist/packages/*.rpm

      - name: Set up QEMU (arm64 smoke tests)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Run Container Package Smoke Tests (x86_64)
        run: |
          SMOKE_ARCH=x86_64 ./scripts/smoke_test.sh ./dist/packages

      - name: Run Container Package Smoke Tests (aarch64 via QEMU)
        run: |
          SMOKE_ARCH=aarch64 ./scripts/smoke_test.sh ./dist/packages

      # Publish atomically: assets are uploaded to a draft (invisible to users) and only
      # then made public. An existing release with the same tag is updated in place instead
      # of being deleted first, so a failed upload can never leave Pages pointing at a missing release.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.tag_name }}"
          TITLE="Antigravity Packages - $TAG"
          NOTES="Automated release of Google Antigravity & Antigravity IDE for Linux. IDE: ${{ needs.check.outputs.ide_version }} | Hub: ${{ needs.check.outputs.hub_version }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; updating assets in place."
            gh release upload "$TAG" ./dist/packages/* --clobber
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if [ ! -e "./dist/packages/$asset" ]; then
                echo "Removing stale asset $asset"
                gh release delete-asset "$TAG" "$asset" --yes
              fi
            done
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" ./dist/packages/* --draft --title "$TITLE" --notes "$NOTES"
            gh release edit "$TAG" --draft=false
          fi

      - name: Prepare RPM files for repository metadata
        run: |
          mkdir -p ./dist/rpm
          cp ./dist/packages/*.rpm ./dist/rpm/

      - name: Setup Bun for Site Generation
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Site Dependencies
        run: |
          cd site
          bun install --frozen-lockfile

      - name: Generate Repository Metadata & Astro Site
        env:
          REQUIRE_SIGNING: 'true'
          # Transition: legacy clients still use the github.io APT URL. Set to 'false' to drop the
          # ~640 MB .deb pool from Pages once they have migrated to https://apt.x3m.industries/deb
          KEEP_DEB_POOL: 'true'
        run: |
          ./scripts/generate_repos.sh "${{ needs.check.outputs.tag_name }}" ./dist

      - name: Clean up temporary package files before Pages upload
        run: |
          rm -rf ./dist/packages
          rm -f ./dist/rpm/*.rpm

      - name: Check Pages artifact size
        run: |
          ./scripts/check_pages_size.sh ./dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
