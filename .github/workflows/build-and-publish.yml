name: Build and Publish Packages

on:
  schedule:
    - cron: '30 2 * * *' # Nightly at 02:30 UTC (04:30 CEST)
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all packages'
        required: false
        type: boolean
        default: false
      force_ide:
        description: 'Force rebuild Antigravity IDE only'
        required: false
        type: boolean
        default: false
      force_hub:
        description: 'Force rebuild Antigravity Hub only'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "packaging"
  cancel-in-progress: false

jobs:
  check:
    name: Check Upstream Releases
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      ide_needs_build: ${{ steps.check.outputs.ide_needs_build }}
      hub_needs_build: ${{ steps.check.outputs.hub_needs_build }}
      tag_name: ${{ steps.check.outputs.tag_name }}
      prev_tag: ${{ steps.check.outputs.prev_tag }}
      ide_version: ${{ steps.check.outputs.ide_version }}
      ide_url_x64: ${{ steps.check.outputs.ide_url_x64 }}
      ide_url_arm64: ${{ steps.check.outputs.ide_url_arm64 }}
      hub_version: ${{ steps.check.outputs.hub_version }}
      hub_url_x64: ${{ steps.check.outputs.hub_url_x64 }}
      hub_url_arm64: ${{ steps.check.outputs.hub_url_arm64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force_build }}
          FORCE_IDE: ${{ inputs.force_ide }}
          FORCE_HUB: ${{ inputs.force_hub }}
        run: |
          python3 scripts/check_upstream.py

  build:
    name: Build Packages & Repositories
    needs: check
    if: needs.check.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm createrepo-c dpkg-dev apt-utils zstd

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            rm -rf ~/.rpmmacros
            {
              echo "%_openpgp_sign_id E83A23BC57FE6953E4B5F4657A48CA4D7E7B6601"
              echo "%_gpg_name E83A23BC57FE6953E4B5F4657A48CA4D7E7B6601"
              echo "%_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback"
            } > ~/.rpmmacros
          fi

      # Reuse prebuilt packages if only one of the apps changed
      - name: Reuse prebuilt Antigravity Hub packages
        if: needs.check.outputs.hub_needs_build != 'true' && needs.check.outputs.prev_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist/packages
          echo "Reusing prebuilt Hub packages from ${{ needs.check.outputs.prev_tag }}..."
          gh release download "${{ needs.check.outputs.prev_tag }}" \
            --pattern "antigravity-${{ needs.check.outputs.hub_version }}*" \
            --pattern "antigravity_${{ needs.check.outputs.hub_version }}*" \
            --dir ./dist/packages || true

      - name: Reuse prebuilt Antigravity IDE packages
        if: needs.check.outputs.ide_needs_build != 'true' && needs.check.outputs.prev_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist/packages
          echo "Reusing prebuilt IDE packages from ${{ needs.check.outputs.prev_tag }}..."
          gh release download "${{ needs.check.outputs.prev_tag }}" \
            --pattern "antigravity-ide-${{ needs.check.outputs.ide_version }}*" \
            --pattern "antigravity-ide_${{ needs.check.outputs.ide_version }}*" \
            --dir ./dist/packages || true

      # Build Antigravity IDE only if needed
      - name: Build Antigravity IDE (x86_64)
        if: needs.check.outputs.ide_needs_build == 'true' && needs.check.outputs.ide_url_x64 != ''
        run: |
          python3 scripts/build_packages.py \
            --package antigravity-ide \
            --version-full "${{ needs.check.outputs.ide_version }}" \
            --url "${{ needs.check.outputs.ide_url_x64 }}" \
            --arch x86_64 \
            --output-dir ./dist/packages

      - name: Build Antigravity IDE (aarch64 / arm64)
        if: needs.check.outputs.ide_needs_build == 'true' && needs.check.outputs.ide_url_arm64 != ''
        run: |
          python3 scripts/build_packages.py \
            --package antigravity-ide \
            --version-full "${{ needs.check.outputs.ide_version }}" \
            --url "${{ needs.check.outputs.ide_url_arm64 }}" \
            --arch aarch64 \
            --output-dir ./dist/packages

      # Build Antigravity Hub only if needed
      - name: Build Antigravity Hub (x86_64)
        if: needs.check.outputs.hub_needs_build == 'true' && needs.check.outputs.hub_url_x64 != ''
        run: |
          python3 scripts/build_packages.py \
            --package antigravity \
            --version-full "${{ needs.check.outputs.hub_version }}" \
            --url "${{ needs.check.outputs.hub_url_x64 }}" \
            --arch x86_64 \
            --output-dir ./dist/packages

      - name: Build Antigravity Hub (aarch64 / arm64)
        if: needs.check.outputs.hub_needs_build == 'true' && needs.check.outputs.hub_url_arm64 != ''
        run: |
          python3 scripts/build_packages.py \
            --package antigravity \
            --version-full "${{ needs.check.outputs.hub_version }}" \
            --url "${{ needs.check.outputs.hub_url_arm64 }}" \
            --arch aarch64 \
            --output-dir ./dist/packages

      - name: Flatten packages directory
        run: |
          find ./dist/packages -mindepth 2 -type f -exec mv -t ./dist/packages {} +
          find ./dist/packages -mindepth 1 -type d -delete
          ls -la ./dist/packages

      - name: Sign RPM packages with GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            for f in ./dist/packages/*.rpm; do
              [ -e "$f" ] || continue
              if ! rpm -qpi "$f" | grep -q "Signature.*(none)"; then
                echo "$f is already signed."
                continue
              fi
              echo "Signing $f..."
              rpmsign --addsign "$f"
              if rpm -qpi "$f" | grep -q "Signature.*(none)"; then
                echo "Error: $f was not signed!"
                exit 1
              fi
            done
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.check.outputs.tag_name }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          git tag -d "$TAG" 2>/dev/null || true
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

          gh release create "$TAG" ./dist/packages/* \
            --title "Antigravity Packages - $TAG" \
            --notes "Automated release of Google Antigravity & Antigravity IDE for Linux. IDE: ${{ needs.check.outputs.ide_version }} | Hub: ${{ needs.check.outputs.hub_version }}"

      - name: Prepare RPM files for repository metadata
        run: |
          mkdir -p ./dist/rpm
          cp ./dist/packages/*.rpm ./dist/rpm/

      - name: Generate Repository Metadata
        run: |
          ./scripts/generate_repos.sh "${{ needs.check.outputs.tag_name }}" ./dist

      - name: Clean up temporary package files before Pages upload
        run: |
          rm -rf ./dist/packages
          rm -f ./dist/rpm/*.rpm

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
