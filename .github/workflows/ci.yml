name: CI & Quality Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Validation Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils shellcheck

      - name: Validate Desktop Entry Files
        run: |
          desktop-file-validate desktop/*.desktop

      - name: Run ShellCheck on Bash Scripts
        run: |
          shellcheck --severity=warning scripts/generate_repos.sh scripts/smoke_test.sh install.sh

      - name: Run Unit Tests
        run: |
          python3 -m unittest discover tests -v
