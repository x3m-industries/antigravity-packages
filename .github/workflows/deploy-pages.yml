name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_repos.sh'
      - 'scripts/inject_versions.py'
      - 'scripts/verify_packages.sh'
      - 'scripts/check_pages_size.sh'
      - 'site/**'
      - 'templates/**'
      - 'assets/**'
      - 'desktop/**'
      - 'install.sh'
      - 'README.md'
      - 'google*.html'
      - 'llms.txt'
      - 'llms-full.txt'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with build-and-publish.yml so Pages deployments and releases are serialized.
# Runs are queued (never cancelled): a cancelled deploy mid-flight must not be replaced
# by one that was started from an older release listing.
concurrency:
  group: "packages-and-pages"
  cancel-in-progress: false

env:
  BUN_VERSION: '1.4.2'

jobs:
  deploy:
    name: Build & Deploy Landing Page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Site Dependencies
        run: |
          cd site
          bun install --frozen-lockfile

      - name: Install repository metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c dpkg-dev apt-utils zstd

      # No "|| true": regenerating metadata from an incomplete set of packages would
      # deploy broken DNF/APT repositories.
      - name: Fetch latest release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ./dist/packages ./dist/rpm
          TAG=$(gh release view --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "::error::No release found; refusing to deploy repository metadata without packages."
            exit 1
          fi
          echo "Downloading packages from latest release $TAG..."
          gh release download "$TAG" --dir ./dist/packages
          ./scripts/verify_packages.sh ./dist/packages
          cp ./dist/packages/*.rpm ./dist/rpm/
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Import GPG signing key for repo release signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::error::GPG_PRIVATE_KEY secret is not set. Refusing to deploy unsigned repository metadata."
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Generate Repository Metadata & Landing Page
        env:
          REQUIRE_SIGNING: 'true'
          # Transition: legacy clients still use the github.io APT URL. Set to 'false' to drop the
          # ~640 MB .deb pool from Pages once they have migrated to https://apt.x3m.industries/deb
          KEEP_DEB_POOL: 'true'
        run: |
          ./scripts/generate_repos.sh "$RELEASE_TAG" ./dist

      - name: Clean up package binaries before Pages upload
        run: |
          # Retain only metadata, site assets, and lightweight index files in dist
          rm -rf ./dist/packages
          rm -f ./dist/rpm/*.rpm
          ls -la ./dist

      - name: Check Pages artifact size
        run: |
          ./scripts/check_pages_size.sh ./dist

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
